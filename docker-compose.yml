# Local development backing services. Deployed environments use managed
# Postgres and real S3, so these credentials never leave a developer machine and
# are spelled out here.
name: cv-jobs-compatibility

services:
  postgres:
    # Plain Postgres 17 that also ships the pgvector binaries. The extension is
    # NOT enabled - enabling it later is a migration, not an image swap.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvjobs
      POSTGRES_PASSWORD: cvjobs_dev_password
      POSTGRES_DB: cvjobs
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      # Loopback only, so the database is not reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cvjobs -d cvjobs']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Stands in for S3. Same API, so only the configuration differs in production.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: cvjobs
      MINIO_ROOT_PASSWORD: cvjobs_dev_password
      # The browser PUTs straight here, so this mirrors the bucket CORS policy a
      # deployment needs.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      # 9000 is the S3 API, 9001 the console.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      # Contents are MinIO's own format, not readable files - use the console.
      - ./tmp/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Creates the bucket and exits. Idempotent, so it runs on every `up`.
  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cvjobs cvjobs_dev_password &&
      mc mb --ignore-existing local/cvjobs-resumes
      "

  # Traces, locally. One container instead of a collector, Tempo and Grafana
  # wired together by hand - it is throwaway infrastructure and assembling it
  # properly would teach nobody anything.
  #
  # The applications only ever speak OTLP, so this is interchangeable with an
  # ADOT collector translating for X-Ray in a deployment. Nothing in the code
  # names either.
  otel:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      # Grafana. Explore -> Tempo -> Search to find a trace.
      - '127.0.0.1:3001:3000'
      # OTLP, HTTP then gRPC. The API and worker use HTTP.
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:4317:4317'
    environment:
      # Anonymous access, because this holds nothing and a login prompt on a
      # throwaway dashboard is friction for no benefit.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - otel-data:/data

volumes:
  postgres-data:
  otel-data:
